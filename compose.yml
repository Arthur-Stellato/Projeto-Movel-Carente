name: movelcarente

# Padrão (docker compose up): redis + api + frontend + worker, com o banco no
# Supabase (DATABASE_URL e DIRECT_URL no .env).
# Com --profile local-db (ou full) sobe também um PostgreSQL/PostGIS local.

services:
  redis:
    image: redis:7-alpine
    container_name: redis-movelcarente
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ./api
    container_name: api-movelcarente
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      # Front e API compartilham a origem via Nginx (http://localhost:8080).
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      COOKIE_CROSS_SITE: "false"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      EXPOR_TOKENS_DEV: ${EXPOR_TOKENS_DEV:-false}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false # só existe com --profile local-db / full
    ports:
      - "3000:3000"
    volumes:
      - uploads-data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./front-end
      args:
        VITE_API_URL: /api
    container_name: frontend-movelcarente
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

  # Envia os e-mails da fila (verificação, recuperação de senha...). Sem ele
  # nenhum e-mail sai — o dispatcher do outbox também roda aqui dentro.
  worker:
    build:
      context: ./api
    container_name: worker-movelcarente
    command: npm run worker:email
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      redis:
        condition: service_healthy
      api: # a API aplica as migrations na subida; o worker espera as tabelas existirem
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgis/postgis:16-3.4
    container_name: postgres-movelcarente
    profiles: ["local-db", "full"]
    environment:
      POSTGRES_DB: movelcarente
      POSTGRES_USER: movelcarente
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movelcarente -d movelcarente"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  redis-data:
  uploads-data:
  postgres-data:

name: movelcarente

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: movelcarente
      POSTGRES_USER: movelcarente
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movelcarente}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movelcarente -d movelcarente"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ./api
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://movelcarente:${POSTGRES_PASSWORD:-movelcarente}@postgres:5432/movelcarente?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-troque-esta-chave-local-por-uma-chave-com-mais-de-32-caracteres}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
      COOKIE_CROSS_SITE: "false"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-MóvelCarente <nao-responda@movelcarente.local>}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - uploads-data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ./api
    command: npm run worker:email
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://movelcarente:${POSTGRES_PASSWORD:-movelcarente}@postgres:5432/movelcarente?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-MóvelCarente <nao-responda@movelcarente.local>}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./front-end
      args:
        # A API também é exposta em localhost:3000, permitindo que o Socket.IO
        # e as chamadas HTTP compartilhem a mesma configuração já usada pelo app.
        VITE_API_URL: http://localhost:3000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  uploads-data:
